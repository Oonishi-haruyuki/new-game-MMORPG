    <script>
      // Gracefully ignore Vite HMR / WebSocket close errors in the dev proxy environment
      window.addEventListener('error', function (e) {
        if (
          e &&
          (e.message?.includes('WebSocket') ||
            e.filename?.includes('@vite/client') ||
            e.message?.includes('vite'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          (String(e.reason).includes('WebSocket') ||
            String(e.reason.message).includes('WebSocket') ||
            String(e.reason.stack).includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
